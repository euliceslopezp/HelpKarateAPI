name: Karate DSL API Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod
      karate_tags:
        description: 'Karate tags to execute, for example: @smoke or ~@ignore'
        required: false
        default: '@regresion'

jobs:
  karate-tests:
    name: Run Karate DSL tests
    runs-on: ubuntu-latest

    env:
      KARATE_ENV: ${{ github.event.inputs.environment || 'dev' }}
      KARATE_TAGS: ${{ github.event.inputs.karate_tags || '@smoke' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show execution context
        run: |
          echo "Running Karate tests"
          echo "Environment: ${KARATE_ENV}"
          echo "Tags: ${KARATE_TAGS}"

      - name: Run Karate tests
        run: |
          mvn clean test \
            -Dkarate.env=${KARATE_ENV} \
            -Dkarate.options="--tags ${KARATE_TAGS}"

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: |
            target/karate-reports
            target/surefire-reports
          retention-days: 15

      - name: Publish test summary
        if: always()
        run: |
          echo "## Karate DSL Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${KARATE_ENV}" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${KARATE_TAGS}" >> $GITHUB_STEP_SUMMARY
          echo "Reports uploaded as workflow artifacts." >> $GITHUB_STEP_SUMMARY
